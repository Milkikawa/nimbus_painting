<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimbus Painting Proxy</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="toast" class="toast hidden" role="status"></div>

  <main id="authView" class="auth-shell hidden">
    <section class="auth-card">
      <div class="brand-mark">NP</div>
      <p class="eyebrow">Nimbus Painting Proxy</p>
      <h1 id="authTitle">登录</h1>
      <p id="authHint" class="muted">请输入管理员密码进入后台。</p>
      <label class="field">
        <span>管理员密码</span>
        <input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位密码">
      </label>
      <div class="auth-actions">
        <button id="initButton" class="hidden">初始化</button>
        <button id="loginButton">登录</button>
      </div>
      <p id="authMsg" class="message"></p>
    </section>
  </main>

  <main id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">NP</div>
        <div>
          <strong>Nimbus Painting</strong>
          <span>Admin Console</span>
        </div>
      </div>
      <nav class="nav-list" aria-label="主导航">
        <button data-view="overview">概览</button>
        <button data-view="monitoring">项目监测</button>
        <button data-view="settings">基础设置</button>
        <button data-view="prompts">提示词组</button>
        <button data-view="images">图片管理</button>
        <button data-view="logs">请求日志</button>
      </nav>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p id="viewEyebrow" class="eyebrow">Dashboard</p>
          <h1 id="viewTitle">概览</h1>
        </div>
        <div class="topbar-actions">
          <span id="serviceStatus" class="status-pill">检查中</span>
          <button id="logoutButton" class="button-secondary">退出</button>
        </div>
      </header>
      <section id="pageAlert" class="alert hidden"></section>
      <section id="pageRoot" class="content-grid"></section>
    </section>
  </main>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
