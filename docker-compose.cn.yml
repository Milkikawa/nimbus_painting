# docker-compose.cn.yml —— 适用于国内网络环境，使用 Dockerfile.cn 构建。
# 海外网络环境请使用默认 docker-compose.yml。
#
# 启动命令（国内）：
#   docker compose -f docker-compose.cn.yml up -d --build
services:
  nimbus-painting:
    build:
      context: .
      dockerfile: Dockerfile.cn
    ports:
      - "4030:4030"
    environment:
      LISTEN_ADDR: "${LISTEN_ADDR:-:4030}"
      DB_DRIVER: "${DB_DRIVER:-sqlite}"
      SQLITE_PATH: "${SQLITE_PATH:-/app/config/app.db}"
      MARIADB_DSN: "${MARIADB_DSN:-}"
      UPSTREAM_ENDPOINT: "${UPSTREAM_ENDPOINT:-}"
      IMAGE_DIR: "${IMAGE_DIR:-/app/images}"
      MODEL_CATALOG_PATH: "${MODEL_CATALOG_PATH:-/app/config/upstream_models.json}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      IMAGE_RETURN_MODE: "${IMAGE_RETURN_MODE:-local_url}"
    volumes:
      - ./config:/app/config
      - ./images:/app/images
    networks:
      - 1panel-network
    restart: unless-stopped

# 加入 1Panel 管理面的外部网络，方便和服务器上其他容器互通。
networks:
  1panel-network:
    external: true
